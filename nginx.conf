server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # SPA fallback - todas las rutas apuntan a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (images, fonts, scripts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve video files with correct MIME types, streaming (Byte Range) and moderate cache
    location ~* \.(mp4|webm|mov|avi)$ {
        # CRITICO: Si el archivo NO existe en disco, devuelve 404 real.
        try_files $uri =404;

        types {
            video/mp4       mp4;
            video/webm      webm;
            video/quicktime mov;
        }
        # Accept-Ranges bytes es OBLIGATORIO para Byte Range Requests
        add_header Accept-Ranges bytes always;
        add_header Content-Type "video/mp4" always;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }
}
